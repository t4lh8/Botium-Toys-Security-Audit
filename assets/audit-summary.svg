    <rect x="170" y="196" width="60" height="26" rx="4" fill="#2ea043"/>
    <rect x="230" y="196" width="60" height="26" rx="4" fill="#da3633"/>
    <text x="302" y="214" fill="#e6edf3" font-size="13">2 of 4</text>

    <rect x="170" y="244" width="60" height="26" rx="4" fill="#2ea043"/>
    <rect x="230" y="244" width="60" height="26" rx="4" fill="#da3633"/>
    <text x="302" y="262" fill="#e6edf3" font-size="13">2 of 4</text>
